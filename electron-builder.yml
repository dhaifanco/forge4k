appId: com.forge.videooptimizer
productName: Forge
compression: normal
directories:
  output: release
files:
  - desktop/**
  - server/**
  - dist/**
  - package.json
asarUnpack:
  - server/studio-worker.py
extraResources:
  - from: bin
    to: bin
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!ai/python/Scripts/**'
  - from: docs/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  artifactName: Forge-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Forge-${version}-portable.${ext}
